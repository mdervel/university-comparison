        function createTabs() {
            const tabsContainer = document.getElementById('universityTabs');
            const contentContainer = document.getElementById('tabsContent');
            
            universities.forEach((uni, index) => {
                // Create tab button
                const tab = document.createElement('button');
                tab.className = 'tab' + (index === 0 ? ' active' : '');
                tab.textContent = uni.shortName;
                tab.onclick = () => switchTab(uni.id);
                tabsContainer.appendChild(tab);
                
                // Create tab content
                const content = document.createElement('div');
                content.className = 'tab-content' + (index === 0 ? ' active' : '');
                content.id = `content-${uni.id}`;
                content.innerHTML = createUniversityCard(uni);
                contentContainer.appendChild(content);
            });
        }
        
        function switchTab(id) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`content-${id}`).classList.add('active');
        }
        
        function createUniversityCard(uni) {
            return `
                <div class="university-card">
                    <div class="university-header">
                        <h2 class="university-name">${uni.name}</h2>
                        <span class="badge ${uni.type.toLowerCase()}">${uni.type === "Public" ? "Public university" : "Private university"}</span>
                        <div style="margin-top: 10px; color: #666;">
                            <strong>City:</strong> ${uni.city}
                        </div>
                    </div>
                    
                    <div class="section" style="background: #e3f2fd; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                        <div class="section-title" style="color: #0d47a1;">📅 Entrance Process for August 2027 Start</div>
                        ${uni.entranceProcess ? uni.entranceProcess.map(item => `<div class="list-item" style="border-color: #90caf9;">${item}</div>`).join('') : ''}
                        <div style="margin-top: 15px; padding: 12px; background: white; border-radius: 6px; border-left: 4px solid #1976d2;">
                            <strong>⏰ When to Start:</strong> ${uni.whenToStart || 'Contact admissions office for specific dates'}
                        </div>
                    </div>
                    
                    <div class="cost-headline">${uni.costHeadline}</div>
                    
                    <div class="section">
                        <div class="section-title">Cost Details</div>
                        ${uni.costDetail.map(item => `<div class="list-item">${item}</div>`).join('')}
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Programs & Faculties</div>
                        ${uni.faculties.map(item => `<div class="list-item">${item}</div>`).join('')}
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Description</div>
                        ${uni.description.map(item => `<div class="list-item">${item}</div>`).join('')}
                    </div>
                    
                    ${uni.expertOpinions ? `
                    <div class="section" style="background: #f0f7ff; padding: 20px; border-radius: 8px; border-left: 4px solid #1976d2;">
                        <div class="section-title" style="color: #0d47a1;">🏆 Expert Analysis: Most Valuable Programs</div>
                        ${uni.expertOpinions.map(section => `
                            <div style="margin: 15px 0;">
                                <strong style="color: #1976d2; font-size: 1.05em;">${section.title}</strong>
                                ${section.items.map(item => `<div class="list-item" style="background: white; margin: 5px 0; padding: 8px; border-radius: 4px;">${item}</div>`).join('')}
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}
                    
                    <div class="section">
                        <div class="section-title">Financial Aid & Scholarships (Becas)</div>
                        ${uni.becas.map(item => `<div class="list-item">${item}</div>`).join('')}
                    </div>
                    
                    <div class="section">
                        <div class="section-title">Links</div>
                        <div style="margin-bottom: 10px;">
                            <strong>Official Website:</strong><br>
                            <a href="${uni.website}" target="_blank" class="link">${uni.website} →</a>
                        </div>
                        ${uni.facultyLinks && uni.facultyLinks.length > 0 ? `
                            <div>

                            <div class="photo-container">

                            Note: Campus photos are placeholders in this web version. The original canvas includes actual campus images for Guadalajara and Puebla universities.

            `;
        }
